services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Defina JWT_SECRET no ambiente ou em um arquivo .env (veja .env.example)
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (veja .env.example)}
    volumes:
      - dados:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dados:
