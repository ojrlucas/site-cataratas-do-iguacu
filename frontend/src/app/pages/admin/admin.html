<div class="bg-titulo d-flex justify-content-center align-items-center flex-column color-white" style="height: 260px">
  <section class="titulo" style="margin-top: 60px">
    <h1 class="text-center text-uppercase"><span class="fw-normal d-block">painel</span>administrativo</h1>
  </section>
</div>

<section class="pagina">
  <div class="abas" role="group" aria-label="Seções do painel">
    @for (item of abas; track item.id) {
      <button type="button" class="aba" [class.ativa]="aba() === item.id" (click)="selecionar(item.id)"><i class="bi {{ item.icone }}"></i> {{ item.nome }}</button>
    }
  </div>

  @switch (aba()) {
    @case ('resumo') { <app-admin-resumo /> }
    @case ('pedidos') { <app-admin-pedidos /> }
    @case ('usuarios') { <app-admin-usuarios /> }
    @case ('ingressos') { <app-admin-ingressos /> }
    @case ('atividades') { <app-admin-atividades /> }
  }
</section>
